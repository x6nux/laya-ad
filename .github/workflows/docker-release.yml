name: Build and push laya-server images

# 镜像权重在构建时自动从 laya-ad Release 最新版下载（稳定名资产 laya-ad-fp32.tar.gz）
# 并在镜像内按 PRECISION 量化。发布新 Release 会自动触发（含稳定名 fp32 资产上传），
# 也可手动 dispatch 指定版本号。
# 镜像 tag：<版本>-<精度>（如 v1.0-fp32）共六个；不带精度的 latest 与 <版本> = fp8。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像版本号（如 v1.0；留空取最新 Release 的 tag）"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: laya-server-docker
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install transformers==5.20.2 "safetensors>=0.6.0" \
            'fastapi==0.141.1' 'uvicorn==0.53.0' 'argon2-cffi==25.1.0' \
            'pydantic==2.13.5' 'httpx==0.28.1' 'pytest==9.1.1'
      - name: Backend tests (ad-clf)
        run: cd laya-server/backend && python -m pytest tests/test_ad_classifier.py -q

  build:
    needs: backend-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        precision: [fp32, fp16, bf16, fp8, int8, int4]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and push ${{ matrix.precision }}
        uses: docker/build-push-action@v6
        with:
          context: laya-server
          push: true
          platforms: linux/amd64
          build-args: |
            PRECISION=${{ matrix.precision }}
          tags: ghcr.io/${{ github.repository_owner }}/laya-server:${{ env.TAG }}-${{ matrix.precision }}
          cache-from: type=gha,scope=laya-${{ matrix.precision }}
          cache-to: type=gha,mode=max,scope=laya-${{ matrix.precision }}

  version-tags:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="$(gh release view --repo ${{ github.repository }} --json tagName --jq .tagName)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - name: Push latest and bare version tags (fp8)
        uses: docker/build-push-action@v6
        with:
          context: laya-server
          push: true
          platforms: linux/amd64
          build-args: |
            PRECISION=fp8
          tags: |
            ghcr.io/${{ github.repository_owner }}/laya-server:latest
            ghcr.io/${{ github.repository_owner }}/laya-server:${{ env.TAG }}
          cache-from: type=gha,scope=laya-fp8
          cache-to: type=gha,scope=laya-fp8,mode=max
